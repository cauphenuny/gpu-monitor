<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPU Monitor</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23141a23'/%3E%3Crect x='6' y='9' width='20' height='13' rx='2.5' fill='none' stroke='%237ab3ff' stroke-width='2'/%3E%3Cpath d='M11 25h10' stroke='%237ab3ff' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='15.5' r='2.4' fill='%233ddc97'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="brand"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="8" width="22" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M11 26h10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="16" cy="15" r="2.6" fill="var(--ok)"/></svg>GPU Monitor</div>
  <div id="summary"></div>
  <div class="spacer"></div>
  <form id="addForm">
    <input id="hostInput" placeholder="主机名 / user@host" required>
    <input id="groupInput" list="groupList" placeholder="分组 (可选)">
    <datalist id="groupList"></datalist>
    <button type="submit">＋ 添加</button>
  </form>
  <div id="sortSeg" class="seg" title="卡片排序方式">
    <button type="button" data-sort="manual" class="on">手动</button>
    <button type="button" data-sort="name">名称</button>
    <button type="button" data-sort="idle">空闲</button>
    <button type="button" data-sort="busy">忙碌</button>
  </div>
  <select id="interval" title="自动刷新间隔">
    <option value="5">5s</option><option value="10" selected>10s</option><option value="30">30s</option><option value="60">60s</option><option value="0">手动</option>
  </select>
  <button id="refreshBtn" title="立即刷新">↻ 刷新</button>
  <span id="updated"></span>
</header>
<main id="root"></main>

<script src="/app.js"></script>
</body>
</html>
