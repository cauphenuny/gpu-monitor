<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPU Monitor</title>
<style>
:root{
  --bg:#0e1116; --card:#161b23; --line:#232b38; --text:#e7ecf3; --muted:#8b96a8;
  --ok:#34d399; --warn:#fbbf24; --hot:#f87171; --accent:#7ab3ff;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 20px;background:rgba(14,17,22,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{font-size:16px;font-weight:700;letter-spacing:.3px}
#summary{color:var(--muted);font-size:12px;white-space:nowrap}
.spacer{flex:1}
#addForm{display:flex;gap:6px}
#hostInput{width:200px;background:#0b0e13;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;outline:none;font-size:13px}
#groupInput{width:120px;background:#0b0e13;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;outline:none;font-size:13px}
#hostInput:focus,#groupInput:focus{border-color:var(--accent)}
.seg{display:flex;gap:2px;background:#0b0e13;border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{background:none;border:none;color:var(--muted);border-radius:7px;padding:4px 11px;cursor:pointer;font-size:12px;line-height:1.4}
.seg button:hover{color:var(--text);border:none}
.seg button.on{background:#253044;color:var(--accent);font-weight:600}
button{background:#1d2735;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
button:hover{border-color:var(--accent)}
#interval{background:#0b0e13;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px}
#updated{color:var(--muted);font-size:12px;min-width:100px}
@keyframes spin{to{transform:rotate(1turn)}}
.spin{animation:spin .9s linear infinite;pointer-events:none;opacity:.7}
#root{display:flex;flex-direction:column;gap:14px;padding:12px 20px 40px}
.group-h{display:flex;align-items:center;gap:8px;padding:0 2px 6px}
.gcollapse{background:none;border:none;color:var(--muted);font-size:10px;padding:2px 6px;cursor:pointer}
.gcollapse:hover{color:var(--text);border:none}
.gname{font-weight:700;font-size:14px;color:#d4dce9;white-space:nowrap}
.gsum{color:var(--muted);font-size:12px;white-space:nowrap}
.gspace{flex:1}
.gact{background:none;border:none;color:var(--muted);font-size:12px;padding:2px 5px;cursor:pointer}
.gact:hover{border:none}
.gact.rename:hover{color:var(--accent)}
.gact.del:hover{color:var(--hot)}
.group.collapsed .grid{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
.card[draggable="true"]{cursor:grab}
.card.dragging{opacity:.35}
.card.drag-over{outline:2px dashed var(--accent);outline-offset:-2px}
.group-h.drag-over{outline:2px dashed var(--accent);outline-offset:3px;border-radius:6px}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.dot{width:8px;height:8px;border-radius:50%;background:#556072;flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.dot.off{background:var(--hot);box-shadow:0 0 6px var(--hot)}
.host{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lat{color:var(--muted);font-size:11px;margin-left:auto;flex:none;font-variant-numeric:tabular-nums}
.del{flex:none;border:none;background:none;color:var(--muted);font-size:13px;padding:0 2px;cursor:pointer}
.del:hover{color:var(--hot);border:none}
.clear{flex:none;color:var(--hot);font-size:11px;padding:2px 6px;white-space:nowrap}
.clear:disabled{opacity:.4;cursor:default}
.err-ic{flex:none;color:var(--warn);font-size:13px;cursor:help}
.card.stale .gpu{opacity:.55}
.card.disabled{border-color:rgba(248,113,113,.5);background:repeating-linear-gradient(135deg,var(--card) 0 12px,#1a1d25 12px 24px)}
.card.disabled .gpu{opacity:.45}
.ban{font-size:12px;color:var(--hot);padding:0 0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toggle{flex:none;font-size:11px;padding:2px 6px;white-space:nowrap}
.waiting{color:var(--muted);font-size:12px;padding:4px 0}
.gpu{padding:4px 0 3px;border-top:1px solid var(--line);cursor:pointer}
.gpu:first-of-type{border-top:none}
.gpu:hover{background:rgba(122,179,255,.05)}
.l1{display:flex;align-items:center;gap:6px;min-width:0}
.gpu-tag{font-size:10px;font-weight:700;color:#0e1116;background:var(--accent);border-radius:4px;padding:0 5px;flex:none;min-width:20px;text-align:center}
.gpu-name{font-size:12px;color:#c7d0dd;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcount{flex:none;font-size:11px;color:var(--warn);background:rgba(251,191,36,.1);border-radius:99px;padding:0 7px;white-space:nowrap}
.gpu-side{flex:none;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.l2{display:flex;align-items:center;gap:6px;margin-top:3px}
.mini{flex:none;color:var(--muted);font-size:10px}
.track{flex:1;min-width:26px;height:6px;border-radius:99px;background:#242c39;overflow:hidden}
.fill{height:100%;border-radius:99px;transition:width .5s ease}
.fill.ok{background:linear-gradient(90deg,#16a34a,#34d399)}
.fill.warn{background:linear-gradient(90deg,#d97706,#fbbf24)}
.fill.hot{background:linear-gradient(90deg,#dc2626,#f87171)}
.fill.na{background:#3b465a}
.val{flex:none;font-size:11px;font-variant-numeric:tabular-nums;text-align:right;min-width:28px;white-space:nowrap}
.val.wide{min-width:84px}
.val.ok{color:var(--ok)} .val.warn{color:var(--warn)} .val.hot{color:var(--hot)} .val.na{color:var(--muted)}
.procs{margin:3px 0 1px 2px}
.proc{display:flex;gap:8px;align-items:flex-start;font-size:11px;color:var(--muted);padding:1px 0 1px 10px;border-left:2px solid #2b3547;margin:1px 0}
.pname{flex:1;min-width:0}
.pname span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcontainer{color:#c7d0dd}
.pmeta{flex:none;text-align:right}
.pmeta>div:first-child{display:flex;justify-content:flex-end;gap:8px}
.ptime{white-space:nowrap;font-variant-numeric:tabular-nums}
.pid{flex:none;color:#67718a}
.pmem{flex:none;font-variant-numeric:tabular-nums;color:#a7b2c5}
.hint{color:var(--muted);border:1px dashed #2b3547;border-radius:12px;padding:26px;text-align:center}
.hint code{background:#0b0e13;padding:2px 6px;border-radius:5px}
</style>
</head>
<body>
<header>
  <div class="brand">🖥️ GPU Monitor</div>
  <div id="summary"></div>
  <div class="spacer"></div>
  <form id="addForm">
    <input id="hostInput" placeholder="主机名 / user@host" required>
    <input id="groupInput" list="groupList" placeholder="分组 (可选)">
    <datalist id="groupList"></datalist>
    <button type="submit">＋ 添加</button>
  </form>
  <div id="sortSeg" class="seg" title="卡片排序方式">
    <button type="button" data-sort="manual" class="on">手动</button>
    <button type="button" data-sort="name">名称</button>
    <button type="button" data-sort="idle">空闲</button>
    <button type="button" data-sort="busy">忙碌</button>
  </div>
  <select id="interval" title="自动刷新间隔">
    <option value="5">5s</option><option value="10" selected>10s</option><option value="30">30s</option><option value="60">60s</option><option value="0">手动</option>
  </select>
  <button id="refreshBtn" title="立即刷新">↻ 刷新</button>
  <span id="updated"></span>
</header>
<main id="root"></main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let entries = [], results = new Map(), lastUpdate = null, inFlight = false, timer = null;
let disabled = new Map();   // host → 禁用原因
let collapsedGroups = new Set(JSON.parse(localStorage.getItem('gpumon.collapsed') || '[]'));
let openGpus = new Set();   // "host|uuid" → 展开该 GPU 的进程列表
let dragInfo = null, isDragging = false;   // 手动排序模式的拖拽状态
const clearingHosts = new Set();
const clearToken = '__GPUMON_CLEAR_TOKEN__';
let refreshAfterClear = false;

const fmtMiB = v => v == null ? '--' : v >= 1024 ? (v/1024).toFixed(1)+' GB' : Math.round(v)+' MB';
const fmtG = v => v == null ? '--' : (v/1024).toFixed(1);
const fpct = v => v == null ? '--' : Math.round(v)+'%';
function fmtDuration(seconds){
  if (!Number.isFinite(seconds) || seconds < 0) return '--';
  const s = Math.floor(seconds);
  if (s >= 86400) return Math.floor(s/86400)+'天'+Math.floor(s%86400/3600)+'小时';
  if (s >= 3600) return Math.floor(s/3600)+'小时'+Math.floor(s%3600/60)+'分';
  if (s >= 60) return Math.floor(s/60)+'分'+s%60+'秒';
  return s+'秒';
}
const cls = p => p == null ? 'na' : p < 50 ? 'ok' : p < 80 ? 'warn' : 'hot';
const sortMode = () => document.querySelector('#sortSeg .on')?.dataset.sort || 'manual';
function bar(p){
  const q = p == null ? null : Math.max(0, Math.min(100, p));
  return `<div class="track"><div class="fill ${cls(q)}" style="width:${q == null ? 0 : q.toFixed(1)}%"></div></div>`;
}

function gpuRow(host, g){
  const key = host + '|' + (g.uuid || g.index);
  const open = openGpus.has(key);
  const memPct = (g.mem_total && g.mem_used != null) ? g.mem_used / g.mem_total * 100 : null;
  const n = (g.procs || []).length;
  const procs = (open && n) ? `<div class="procs">${g.procs.map(p =>
    `<div class="proc"><div class="pname">${p.container ? `<span class="pcontainer" title="${esc(p.container)}">${esc(p.container)}</span>` : ''}<span title="${esc(p.name)}">${esc(p.name)}</span></div><div class="pmeta"><div><span class="pid">#${esc(p.pid)}</span><span class="pmem">${p.mem != null ? fmtMiB(p.mem) : ''}</span></div><div class="ptime" title="进程已运行时长（截至本次采集）">已运行 ${fmtDuration(p.elapsed_seconds)}</div></div></div>`).join('')}</div>` : '';
  return `<div class="gpu" data-gpu="${esc(key)}" title="点击展开/收起进程">
    <div class="l1"><span class="gpu-tag">${esc(g.index)}</span><span class="gpu-name">${esc(g.name)}</span>
      ${n ? `<span class="pcount">${n} 进程</span>` : ''}
      <span class="gpu-side">${g.temp != null ? Math.round(g.temp)+'°C' : ''}${g.temp != null && g.power != null ? ' · ' : ''}${g.power != null ? Math.round(g.power)+'W' : ''}</span></div>
    <div class="l2"><span class="mini">利用率</span>${bar(g.util)}<span class="val ${cls(g.util)}">${fpct(g.util)}</span>
      <span class="mini">显存</span>${bar(memPct)}<span class="val wide ${cls(memPct)}">${fmtG(g.mem_used)}/${fmtG(g.mem_total)} GB</span></div>
    ${procs}
  </div>`;
}

function card(host, group){
  const r = results.get(host);
  let dot = '<span class="dot"></span>', lat = '', ic = '', body = '<div class="waiting">等待数据…</div>';
  if (r){
    dot = `<span class="dot ${r.ok ? 'on' : 'off'}"></span>`;
    if (r.error) ic = `<span class="err-ic" title="${esc(r.error)}">⚠</span>`;
    body = r.gpus.length ? r.gpus.map(g => gpuRow(host, g)).join('')
      : `<div class="waiting">${r.ok ? '未检测到 GPU' : '暂无数据'}</div>`;
    if (r.latency_ms != null) lat = `<span class="lat">${r.latency_ms} ms</span>`;
  }
  const manual = sortMode() === 'manual';
  const ban = disabled.get(host);
  return `<section class="card${r && !r.ok ? ' stale' : ''}${ban != null ? ' disabled' : ''}" draggable="${manual}" data-host="${esc(host)}" data-group="${esc(group)}">
    <div class="card-h">${dot}<span class="host">${esc(host)}</span>${ic}${lat}
      <button type="button" class="toggle" data-toggle-host="${esc(host)}" title="${ban != null ? '解除禁用' : '临时标记为不准使用'}">${ban != null ? '启用' : '禁用'}</button>
      <button type="button" class="clear" data-clear-host="${esc(host)}" ${!r?.ok || clearingHosts.has(host) ? 'disabled' : ''} title="强制结束此服务器所有 GPU 任务，最多等待 3 分钟确认清空">${clearingHosts.has(host) ? '清空中…' : '一键清空'}</button>
      <button class="del" data-del-host="${esc(host)}" data-del-group="${esc(group)}" title="移除">✕</button></div>
    ${ban != null ? `<div class="ban" title="${esc(ban)}">⛔ 暂停使用：${esc(ban)}</div>` : ''}
    ${body}</section>`;
}

function tally(hostList){
  let online = 0, total = 0, busy = 0;
  for (const h of hostList){
    const r = results.get(h);
    if (!r || !r.ok) continue;
    online++;
    if (disabled.has(h)) continue;   // 禁用机器的卡不计入忙闲, 免得被当成空闲卡
    for (const g of r.gpus){
      total++;
      const mp = (g.mem_total && g.mem_used != null) ? g.mem_used / g.mem_total * 100 : 0;
      if ((g.util || 0) >= 5 || mp >= 10) busy++;
    }
  }
  return {online, total, busy, idle: total - busy};
}

function hostStat(h){
  const r = results.get(h);
  if (!r || !r.ok) return null;   // 未知/离线
  let busy = 0, idle = 0, maxUtil = 0;
  for (const g of r.gpus){
    const mp = (g.mem_total && g.mem_used != null) ? g.mem_used / g.mem_total * 100 : 0;
    const b = (g.util || 0) >= 5 || mp >= 10;
    busy += b; idle += !b; maxUtil = Math.max(maxUtil, g.util || 0);
  }
  return {busy, idle, maxUtil};
}

function sortedHosts(list){
  const mode = sortMode();
  if (mode === 'manual') return list;
  const arr = [...list];
  const st = h => (!disabled.has(h) && hostStat(h)) || {busy: 0, idle: -1, maxUtil: 0};   // 离线/未知/禁用统一垫底
  const byName = (a, b) => a.localeCompare(b, undefined, {numeric: true});
  if (mode === 'name')
    arr.sort(byName);
  else if (mode === 'idle')
    arr.sort((a, b) => st(b).idle - st(a).idle || st(a).maxUtil - st(b).maxUtil || byName(a, b));
  else if (mode === 'busy')
    arr.sort((a, b) => st(b).busy - st(a).busy || st(b).maxUtil - st(a).maxUtil || byName(a, b));
  return arr;
}

function render(){
  $('#groupList').innerHTML = [...new Set(entries.map(e => e.group).filter(Boolean))]
    .map(g => `<option value="${esc(g)}">`).join('');
  const root = $('#root');
  if (!entries.length){
    root.innerHTML = `<div class="hint">还没有主机。在右上角输入主机名添加，例如 <code>lab-gpu-01</code> 或 <code>user@10.0.0.5</code>，可填写分组；<br>
      连接使用本机 <code>ssh</code>（<code>~/.ssh/config</code> 别名与密钥均可），请确保 <code>ssh &lt;主机&gt;</code> 可免密登录且装有 nvidia-smi。</div>`;
    $('#summary').textContent = '';
    return;
  }
  const order = [], byGroup = new Map();
  for (const e of entries){
    const g = e.group || '';
    if (!byGroup.has(g)){ byGroup.set(g, []); order.push(g); }
    byGroup.get(g).push(e.host);
  }
  if (order.includes('')){ order.splice(order.indexOf(''), 1); order.push(''); }  // 未分组放最后
  root.innerHTML = order.map(g => {
    const list = byGroup.get(g);
    const t = tally(list);
    const col = collapsedGroups.has(g);
    return `<section class="group${col ? ' collapsed' : ''}" data-group="${esc(g)}">
      <div class="group-h" data-group="${esc(g)}">
        <button class="gcollapse" data-gcol="${esc(g)}" title="折叠/展开">${col ? '▶' : '▼'}</button>
        <span class="gname">${g === '' ? '未分组' : esc(g)}</span>
        <span class="gsum">${t.online}/${list.length} 在线 · GPU ${t.busy} 忙 / ${t.idle} 闲</span>
        <span class="gspace"></span>
        <button class="gact rename" data-grename="${esc(g)}" title="重命名分组">✎</button>
        <button class="gact del" data-gdel="${esc(g)}" title="删除分组及其主机">✕</button>
      </div>
      <div class="grid">${sortedHosts(list).map(h => card(h, g)).join('')}</div>
    </section>`;
  }).join('');
  const all = [...new Set(entries.map(e => e.host))];
  const t = tally(all);
  $('#summary').textContent = `${t.online}/${all.length} 主机在线 · ${t.total} GPU · ${t.busy} 忙 · ${t.idle} 闲`;
}

async function loadHosts(){
  const d = await (await fetch('/api/hosts')).json();
  entries = d.hosts || [];
  disabled = new Map(Object.entries(d.disabled || {}));
}

async function refresh(){
  if (inFlight) return;
  if (!entries.length){ results = new Map(); lastUpdate = Date.now(); if (!isDragging) render(); upd(); return; }
  inFlight = true;
  $('#refreshBtn').classList.add('spin');
  try{
    const d = await (await fetch('/api/status')).json();
    const prev = results;   // 本轮失败的主机沿用上一轮 GPU 数据, 只标记错误
    results = new Map((d.results || []).map(x => {
      const p = prev.get(x.host);
      return [x.host, (!x.ok && p?.gpus?.length) ? {...p, ok: false, error: x.error} : x];
    }));
    disabled = new Map((d.results || []).filter(x => x.disabled != null).map(x => [x.host, x.disabled]));   // 同步别人在其他页面做的禁用
    lastUpdate = Date.now();
    if (!isDragging) render();   // 拖拽中不重建 DOM, 拖完再渲染
    upd();
  }catch(e){
    $('#updated').textContent = '刷新失败';
  }finally{
    inFlight = false;
    $('#refreshBtn').classList.remove('spin');
    if (refreshAfterClear){ refreshAfterClear = false; refresh(); }
  }
}

function upd(){
  $('#updated').textContent = lastUpdate ? '更新于 ' + Math.round((Date.now() - lastUpdate)/1000) + ' 秒前' : '';
}

$('#addForm').addEventListener('submit', async e => {
  e.preventDefault();
  const host = $('#hostInput').value.trim();
  if (!host) return;
  const group = $('#groupInput').value.trim();
  const d = await (await fetch('/api/hosts', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({host, group})})).json();
  entries = d.hosts || [];
  $('#hostInput').value = '';
  render(); refresh();
});

$('#root').addEventListener('click', async e => {
  const toggle = e.target.closest('[data-toggle-host]');
  if (toggle){
    const host = toggle.dataset.toggleHost;
    let body;
    if (disabled.has(host)){
      if (!confirm(`解除 ${host} 的禁用？`)) return;
      body = {host, disabled: false};
    } else {
      const reason = prompt(`临时禁用 ${host}，标注为现在不准使用。\n原因（可选）：`);
      if (reason == null) return;
      body = {host, disabled: true, reason};
    }
    const d = await (await fetch('/api/hosts/disable', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)})).json();
    disabled = new Map(Object.entries(d.disabled || {}));
    render();
    if (inFlight) refreshAfterClear = true;   // 进行中的刷新带的是旧状态, 结束后再刷一次
    return;
  }
  const clear = e.target.closest('[data-clear-host]');
  if (clear){
    const host = clear.dataset.clearHost;
    if (clear.disabled || clearingHosts.has(host)) return;
    const confirmation = prompt(`将强制结束 ${host} 上所有 GPU 任务，未保存的进度会丢失。\n请输入完整服务器名确认：\n${host}`);
    if (confirmation == null) return;
    if (confirmation !== host){ alert('服务器名不匹配，未执行清空'); return; }
    clearingHosts.add(host);
    render();
    try{
      const response = await fetch('/api/hosts/clear', {method:'POST', headers:{'Content-Type':'application/json', 'X-GPUMon-Token':clearToken}, body:JSON.stringify({host, confirmation})});
      const d = await response.json();
      const messages = [`${host}：${d.ok ? '已清空' : '未完全清空'}`];
      if (d.killed) messages.push(`已发送强制终止：${d.killed.length} 个进程`);
      if (d.failed?.length) messages.push('终止失败：' + d.failed.map(p => `PID ${p.pid}: ${p.error}`).join('；'));
      if (d.remaining?.length) messages.push('仍在占卡：PID ' + d.remaining.join(', '));
      if (d.error) messages.push(d.error);
      alert(messages.join('\n'));
    }catch(e){
      alert(`${host}：清空请求失败，部分任务可能已终止，请刷新确认`);
    }finally{
      clearingHosts.delete(host);
      render();
      if (inFlight) refreshAfterClear = true;
      else refresh();
    }
    return;
  }
  const del = e.target.closest('[data-del-host]');
  if (del){
    await fetch('/api/hosts?host=' + encodeURIComponent(del.dataset.delHost) + '&group=' + encodeURIComponent(del.dataset.delGroup || ''), {method:'DELETE'});
    await loadHosts(); render();
    return;
  }
  const gcol = e.target.closest('[data-gcol]');
  if (gcol){
    const g = gcol.dataset.gcol;
    collapsedGroups.has(g) ? collapsedGroups.delete(g) : collapsedGroups.add(g);
    localStorage.setItem('gpumon.collapsed', JSON.stringify([...collapsedGroups]));
    render();
    return;
  }
  const gren = e.target.closest('[data-grename]');
  if (gren){
    const from = gren.dataset.grename;
    const to = prompt('重命名分组:', from === '' ? '' : from);
    if (to == null) return;
    const t = to.trim();
    if (!t || t === from) return;
    const d = await (await fetch('/api/groups/rename', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({from, to: t})})).json();
    entries = d.hosts || [];
    render(); refresh();
    return;
  }
  const gdel = e.target.closest('[data-gdel]');
  if (gdel){
    const g = gdel.dataset.gdel;
    if (!confirm(`删除分组 "${g === '' ? '未分组' : g}" 及其中所有主机?`)) return;
    await fetch('/api/groups?group=' + encodeURIComponent(g), {method:'DELETE'});
    await loadHosts(); render();
    return;
  }
  const gpu = e.target.closest('.gpu');
  if (gpu){
    const k = gpu.dataset.gpu;
    openGpus.has(k) ? openGpus.delete(k) : openGpus.add(k);
    render();
  }
});

$('#refreshBtn').addEventListener('click', refresh);

/* ---- 手动排序: 拖拽卡片. 拖到同组卡片前 = 调整顺序; 拖到另一组 = 移动分组 ---- */
function clearDragMarks(){
  document.querySelectorAll('.drag-over,.dragging').forEach(el => el.classList.remove('drag-over', 'dragging'));
}

function moveEntry(src, dst, dstGroup){
  // 从 entries 中取下 src, 插到 dst (host+group 定位) 之前; 跨组拖拽时 group 改为 dstGroup
  const srcIdx = entries.findIndex(e => e.host === src.host && e.group === src.group);
  const dstIdx = entries.findIndex(e => e.host === dst.host && e.group === dst.group);
  if (srcIdx < 0 || dstIdx < 0) return null;
  const out = entries.filter((_, i) => i !== srcIdx);
  const at = out.findIndex(e => e.host === dst.host && e.group === dst.group);
  if (at < 0) return null;
  out.splice(at, 0, {host: src.host, group: dstGroup});
  return out;
}

function appendToGroup(src, group){
  // 取下 src, 插到该组最后一条之后 (拖到分组标题栏上)
  const srcIdx = entries.findIndex(e => e.host === src.host && e.group === src.group);
  if (srcIdx < 0) return null;
  const out = entries.filter((_, i) => i !== srcIdx);
  let at = 0;
  out.forEach((e, i) => { if ((e.group || '') === group) at = i + 1; });
  out.splice(at, 0, {host: src.host, group});
  return out;
}

async function persistOrder(list){
  const d = await (await fetch('/api/hosts/reorder', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({hosts: list})})).json();
  entries = d.hosts || list;
  render();
}

$('#root').addEventListener('dragstart', e => {
  const card = e.target.closest('.card');
  if (!card || card.draggable !== true) return;
  dragInfo = {host: card.dataset.host, group: card.dataset.group || ''};
  isDragging = true;
  card.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragInfo.host);
});

$('#root').addEventListener('dragover', e => {
  if (!dragInfo) return;
  const card = e.target.closest('.card');
  const gh = e.target.closest('.group-h');
  clearDragMarks();
  if (card && !(card.dataset.host === dragInfo.host && (card.dataset.group || '') === dragInfo.group)){
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    card.classList.add('drag-over');
  } else if (gh){
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    gh.classList.add('drag-over');
  }
});

$('#root').addEventListener('drop', e => {
  if (!dragInfo) return;
  e.preventDefault();
  const src = dragInfo;
  const card = e.target.closest('.card');
  const gh = e.target.closest('.group-h');
  clearDragMarks();
  let list = null;
  if (card){
    list = moveEntry(src, {host: card.dataset.host, group: card.dataset.group || ''}, card.dataset.group || '');
  } else if (gh){
    list = appendToGroup(src, gh.dataset.group || '');
  }
  if (list) persistOrder(list);
  dragInfo = null; isDragging = false;
});

$('#root').addEventListener('dragend', () => {
  dragInfo = null; isDragging = false;
  clearDragMarks();
  render();   // 补渲染拖拽期间推迟的刷新
});

$('#sortSeg').addEventListener('click', e => {
  const b = e.target.closest('[data-sort]');
  if (!b || b.classList.contains('on')) return;
  document.querySelectorAll('#sortSeg [data-sort]').forEach(x => x.classList.toggle('on', x === b));
  localStorage.setItem('gpumon.sort', b.dataset.sort);
  render();
});

function setTimer(sec){
  if (timer) clearInterval(timer);
  timer = null;
  if (sec > 0) timer = setInterval(refresh, sec*1000);
}
$('#interval').addEventListener('change', e => {
  localStorage.setItem('gpumon.interval', e.target.value);
  setTimer(+e.target.value);
});
setInterval(upd, 1000);

(async () => {
  const savedInterval = localStorage.getItem('gpumon.interval');
  if (savedInterval != null && [...$('#interval').options].some(o => o.value === savedInterval)) $('#interval').value = savedInterval;
  const savedSort = localStorage.getItem('gpumon.sort');
  if (savedSort && document.querySelector(`#sortSeg [data-sort="${savedSort}"]`)){
    document.querySelectorAll('#sortSeg [data-sort]').forEach(b => b.classList.toggle('on', b.dataset.sort === savedSort));
  }
  await loadHosts();
  render();
  refresh();
  setTimer(+$('#interval').value);
})();
</script>
